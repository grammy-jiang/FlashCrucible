[project]
name = "flashcrucible"
version = "0.1.0"
description = "microSD & flash storage endurance, performance, and health test framework"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Grammy Jiang" }]
keywords = ["microsd", "sd-card", "storage", "testing", "endurance", "counterfeit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    # `describe` introspects the click command tree that typer builds, so click
    # is a direct import in tfqa.cli.main. Typer used to pull it in, but 0.27
    # dropped it from its dependencies, which left a fresh install crashing on
    # `import click` before any command could run.
    "click>=8.0",
    "rich>=13.0",
    "platformdirs>=4.0",
    "tomli>=2.0;python_version<'3.11'",
    "jsonschema>=4.25.1",
]

[project.scripts]
tfqa = "tfqa.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["tfqa*"]
exclude = ["tests*", "docs*", "scripts*"]

# Profiles, workflow combos, and JSON schemas are read at runtime, so they have
# to travel with the wheel. Without this the installed CLI cannot find any
# profile and `pipeline` fails before it starts.
[tool.setuptools.package-data]
tfqa = [
    "data/profiles/*.toml",
    "data/workflows/*.toml",
    "data/schemas/json/*.json",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    "jsonschema>=4.25.1",
    "mypy>=1.18.2",
]
lint = [
    "ruff>=0.14.5",
]
test = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
]
