[project]
name = "flashcrucible"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "platformdirs>=4.0",
    "tomli>=2.0;python_version<'3.11'",
    "jsonschema>=4.25.1",
]

[project.scripts]
tfqa = "tfqa.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["tfqa*"]
exclude = ["tests*", "data*", "docs*", "scripts*"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    "jsonschema>=4.25.1",
    "mypy>=1.18.2",
]
lint = [
    "ruff>=0.14.5",
]
test = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
]
