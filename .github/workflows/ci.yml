name: CI

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Sync dependencies
      run: uv sync

    - name: Lint
      run: uv run ruff check .

    - name: Type check
      run: uv run mypy tfqa/ tests/

    - name: Run tests
      run: uv run pytest -q

    - name: Validate JSON schemas
      run: uv run tfqa validate-schemas --output json
