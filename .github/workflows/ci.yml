name: CI

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Install dependencies
      run: make install

    # One target, so CI and a local run cannot drift. `make verify` covers
    # lint, formatting, types, the tests, the same tests with every external
    # tool hidden, and the shipped JSON schemas. The failing target is named in
    # the output. See the Makefile.
    - name: Verify
      run: make verify
